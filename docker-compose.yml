services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: villages
      POSTGRES_PASSWORD: villages
      POSTGRES_DB: villages
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U villages -d villages"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    image: node:20-alpine
    working_dir: /workspace
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://villages:villages@postgres:5432/villages
      REDIS_URL: redis://redis:6379
      REALM_DIRECTORY_JSON: >
        [{"id":"alpha","name":"Alpha Realm","httpUrl":"http://127.0.0.1:4101","wsUrl":"ws://127.0.0.1:4101/ws"},{"id":"beta","name":"Beta Realm","httpUrl":"http://127.0.0.1:4102","wsUrl":"ws://127.0.0.1:4102/ws"}]
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
      - villages-dev-node_modules:/workspace/node_modules
      - villages-dev-yarn-cache:/root/.yarn
    command:
      [
        "sh",
        "-lc",
        "corepack enable && (yarn install --immutable || yarn install) && yarn workspace gateway dev"
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  realm-alpha:
    image: node:20-alpine
    working_dir: /workspace
    environment:
      PORT: 4101
      REALM_ID: alpha
      REALM_NAME: Alpha Realm
      GATEWAY_URL: http://gateway:4000
      DATABASE_URL: postgresql://villages:villages@postgres:5432/villages
      REDIS_URL: redis://redis:6379
      TEST_MODE: "true"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "4101:4101"
    volumes:
      - .:/workspace
      - villages-dev-node_modules:/workspace/node_modules
      - villages-dev-yarn-cache:/root/.yarn
    command:
      [
        "sh",
        "-lc",
        "corepack enable && (yarn install --immutable || yarn install) && yarn workspace realm dev:alpha"
      ]
    depends_on:
      gateway:
        condition: service_started

  realm-beta:
    image: node:20-alpine
    working_dir: /workspace
    environment:
      PORT: 4102
      REALM_ID: beta
      REALM_NAME: Beta Realm
      GATEWAY_URL: http://gateway:4000
      DATABASE_URL: postgresql://villages:villages@postgres:5432/villages
      REDIS_URL: redis://redis:6379
      TEST_MODE: "true"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "4102:4102"
    volumes:
      - .:/workspace
      - villages-dev-node_modules:/workspace/node_modules
      - villages-dev-yarn-cache:/root/.yarn
    command:
      [
        "sh",
        "-lc",
        "corepack enable && (yarn install --immutable || yarn install) && yarn workspace realm dev:beta"
      ]
    depends_on:
      gateway:
        condition: service_started

  web:
    image: node:20-alpine
    working_dir: /workspace
    environment:
      PORT: 3000
      INTERNAL_GATEWAY_URL: http://gateway:4000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "38080:3000"
    volumes:
      - .:/workspace
      - villages-dev-node_modules:/workspace/node_modules
      - villages-dev-yarn-cache:/root/.yarn
    command:
      [
        "sh",
        "-lc",
        "corepack enable && (yarn install --immutable || yarn install) && yarn workspace web exec next dev --hostname 0.0.0.0 --port 3000"
      ]
    depends_on:
      gateway:
        condition: service_started
      realm-alpha:
        condition: service_started
      realm-beta:
        condition: service_started

volumes:
  postgres-dev-data:
  villages-dev-node_modules:
  villages-dev-yarn-cache:
